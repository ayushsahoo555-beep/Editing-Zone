<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    @font-face {
      font-family: "Optimistic";
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
    }
    @font-face {
      font-family: "Optimistic Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
    }
    :where(html) { font-family: "Optimistic", system-ui, sans-serif; }
    :where(code, pre, kbd, samp) { font-family: "Optimistic Mono", ui-monospace, monospace; }
  </style>
  
  <style data-metaai-safe-area>
    :root { scroll-padding-top: var(--safe-area-scroll-padding-top, 0px); }
    [data-safe-area-inset-root]::before {
      background: inherit;
      content: "";
      height: var(--safe-area-inset-top, 0px);
      inset: 0 0 auto;
      pointer-events: none;
      position: fixed;
      z-index: 2147483647;
    }
  </style>

  <script data-metaai-safe-area-runtime>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const rawInset = params.get('top_inset_px');
      const parsedInset = rawInset !== null && /^\d+$/.test(rawInset) ? Number(rawInset) : 0;
      const topInset = params.get('has_top_banner') === '1' ? Math.min(parsedInset, 256) : 0;
      document.documentElement.style.setProperty('--safe-area-inset-top', `${topInset}px`);
      document.documentElement.style.setProperty('--safe-area-scroll-padding-top', `${topInset}px`);
      
      function observeNavigation() {
        const root = document.getElementById('root');
        if (root === null) return;
        const observed = new Set();
        let scheduled = false;
        function syncScrollPadding() {
          const elements = new Set(root.querySelectorAll('[data-safe-area-sticky-top]'));
          for (const element of observed) {
            if (!elements.has(element)) { resizeObserver.unobserve(element); observed.delete(element); }
          }
          for (const element of elements) {
            if (!observed.has(element)) { resizeObserver.observe(element); observed.add(element); }
          }
          let padding = topInset;
          for (const element of elements) {
            const style = window.getComputedStyle(element);
            if (style.position !== 'sticky' && style.position !== 'fixed') continue;
            const top = Number.parseFloat(style.top);
            if (Number.isFinite(top)) { padding = Math.max(padding, top + element.getBoundingClientRect().height); }
          }
          document.documentElement.style.setProperty('--safe-area-scroll-padding-top', `${Math.ceil(padding)}px`);
        }
        function scheduleUpdate() {
          if (scheduled) return;
          scheduled = true;
          queueMicrotask(() => { scheduled = false; syncScrollPadding(); });
        }
        const resizeObserver = new ResizeObserver(scheduleUpdate);
        const mutationObserver = new MutationObserver(scheduleUpdate);
        mutationObserver.observe(root, { attributeFilter: ['class', 'data-safe-area-sticky-top', 'hidden', 'style'], attributes: true, childList: true, subtree: true });
        window.addEventListener('resize', scheduleUpdate);
        scheduleUpdate();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', observeNavigation, { once: true });
      } else {
        observeNavigation();
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Artifact</title>
  
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap");
    *,:after,:before {
      box-sizing: border-box;
      border: 0 solid #e5e7eb;
    }
    :root {
      --bg: #fffbf0; --surface: #fff; --surface-soft: #fff7e8; --border: #eaeae9;
      --border-strong: #d9d9d6; --ink: #111113; --ink-2: #111827; --muted: #6b7280;
      --faint: #9ca3af; --violet: #6366f1; --violet-deep: #7c3aed; --lime: #e9ff8e;
      --field: #f6f1e7; --shadow-soft: 0 1px 2px rgba(0,0,0,.06);
      --shadow-lift: 0 12px 32px -12px rgba(17,17,19,.18);
    }
    [data-theme=dark] {
      --bg: #0f0f10; --surface: #1e1e20; --surface-soft: #18181b; --border: #2a2a2e;
      --border-strong: #3a3a42; --ink: #f5f5f7; --ink-2: #e8e8ea; --muted: #b0b0b8;
      --faint: #8a8a92; --violet: #818cf8; --violet-deep: #a78bfa; --lime: #e9ff8e;
      --field: #27272a; --shadow-soft: 0 1px 2px rgba(0,0,0,.4);
      --shadow-lift: 0 12px 32px -12px rgba(0,0,0,.6);
    }
    html { scroll-behavior: smooth; }
    body {
      background: radial-gradient(ellipse 60% 40% at 20% 10%, rgba(99,102,241,.08) 0, transparent 60%),
                  radial-gradient(ellipse 60% 40% at 80% 90%, rgba(251,146,60,.12) 0, transparent 60%),
                  radial-gradient(ellipse 70% 50% at 50% 50%, rgba(214,255,87,.06) 0, transparent 65%), var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s ease, color .3s ease;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    
    /* Enhanced 3D Floating Background Elements Styling */
    .ez-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      perspective: 1000px;
    }
    .ez-bg > * {
      position: absolute;
      color: var(--ink);
      will-change: transform;
      transition: transform 0.15s cubic-bezier(0, 0, 0.2, 1);
    }
    @keyframes ez-floaty-3d {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotate(var(--rot, 0deg));
      }
      50% {
        transform: translate3d(0, -18px, 25px) rotateX(6deg) rotateY(12deg) rotate(calc(var(--rot, 0deg) + 4deg));
      }
    }
    .ez-floaty {
      animation: ez-floaty-3d 7s ease-in-out infinite;
    }
    .ez-i1 { left: 6%; top: 18%; opacity: .07; --rot: -8deg; }
    .ez-i2 { right: 8%; top: 12%; opacity: .06; --rot: 6deg; animation-delay: 1s; }
    .ez-i3 { left: 12%; bottom: 16%; opacity: .08; --rot: 4deg; animation-delay: 2s; }
    .ez-i4 { right: 14%; bottom: 22%; opacity: .07; --rot: -5deg; animation-delay: .5s; }
    .ez-i5 { left: 45%; top: 8%; opacity: .06; --rot: 10deg; animation-delay: 1.5s; }
    
    .ez-bar {
      display: block;
      width: 4rem;
      height: 1.5rem;
      border-radius: .5rem;
      background: var(--ink);
      opacity: .12;
    }
    .ez-b1 { left: 20%; top: 30%; transform: rotate(-12deg); }
    .ez-b2 { right: 22%; top: 55%; transform: rotate(9deg); }
    .ez-b3 { left: 60%; bottom: 10%; transform: rotate(-6deg); }

    @media (prefers-reduced-motion: reduce) {
      .ez-floaty { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Background Container with 3D floating shapes -->
  <div class="ez-bg">
    <div class="ez-floaty ez-i1">✦</div>
    <div class="ez-floaty ez-i2">❖</div>
    <div class="ez-floaty ez-i3">✧</div>
    <div class="ez-floaty ez-i4">✦</div>
    <div class="ez-floaty ez-i5">❖</div>
    <div class="ez-bar ez-b1 ez-floaty"></div>
    <div class="ez-bar ez-b2 ez-floaty"></div>
    <div class="ez-bar ez-b3 ez-floaty"></div>
  </div>

  <div id="root"></div>

  <!-- Scroll Parallax and Mouse Interaction Script -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const floatyElements = document.querySelectorAll('.ez-floaty');

      // Scroll-based parallax shifting
      window.addEventListener('scroll', () => {
        const scrollY = window.scrollY;
        floatyElements.forEach((el, index) => {
          const depthSpeed = (index + 1) * 0.08;
          const rotateDrift = scrollY * 0.03 * (index % 2 === 0 ? 1 : -1);
          el.style.transform = `translate3d(0, ${-scrollY * depthSpeed}px, ${scrollY * 0.1}px) rotate(${rotateDrift}deg)`;
        });
      }, { passive: true });

      // Mouse-move interaction for extra depth
      window.addEventListener('mousemove', (e) => {
        const mouseX = (e.clientX / window.innerWidth - 0.5) * 25;
        const mouseY = (e.clientY / window.innerHeight - 0.5) * 25;
        floatyElements.forEach((el, index) => {
          const depthFactor = (index + 1) * 0.25;
          el.style.transform += ` translate3d(${mouseX * depthFactor}px, ${mouseY * depthFactor}px, 0)`;
        });
      });
    });
  </script>
